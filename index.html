    <script>
      // Defensive shim: Ensure window.fetch has both getter and setter so environments or extensions reassigning window.fetch won't throw TypeError
      (function() {
        try {
          const originalFetch = window.fetch ? window.fetch.bind(window) : null;
          let activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return activeFetch;
            },
            set(newFetch) {
              if (typeof newFetch === 'function') {
                activeFetch = newFetch;
              }
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}
      })();
    </script>
